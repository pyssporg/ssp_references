[pytest]
testpaths = tests
addopts = -ra
markers =
    level_static: source and policy checks with no execution
    level_unit: single function or object in isolation
    level_component: one workflow module with its collaborators faked
    level_contract: seams between vendored projects, both sides real
    level_integration: committed fixtures and generated outputs read together
    level_system: the build -> simulate -> compare pipeline end to end
    level_acceptance: comparison results judged against trusted baselines
