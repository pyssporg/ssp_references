# Baseline exemptions for ruff's default rule set (IMP-002). Existing
# violations are config-exempted here rather than source-edited; the CI lint
# gate fails on any rule NOT on this list.
[lint]
ignore = [
  "EXE001", "I001", "ISC004", "PLW1510", "RUF009", "SIM117", "UP032",
  "UP033", "UP035", "UP037",
]